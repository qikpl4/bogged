<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bogged Mapping Tool</title>
  <meta name="description" content="Look up Minecraft mappings (Mojmap, Yarn, Intermediary) across versions, straight from packed binary files.">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <main class="container">
    <header>
      <hgroup>
        <h1>Bogged Mapping Tool</h1>
        <p>Easily and quickly compare and convert Minecraft class, field and method names using Bogged data. <a href="https://github.com/qikpl4/bogged">Source code</a></p>
      </hgroup>
    </header>

    <form id="lookup-form" autocomplete="off">
      <fieldset class="side-picker">
        <legend>Side</legend>
        <div class="side-options" role="radiogroup" aria-label="Mapping side">
          <label><input type="radio" name="side" value="mojmap" checked> Mojmap</label>
          <label><input type="radio" name="side" value="yarn"> Yarn</label>
          <label><input type="radio" name="side" value="intermediary"> Intermediary</label>
        </div>
      </fieldset>

      <div class="grid query-grid">
        <label for="version">Version
          <select id="version" name="version" required>
            <option>Loading…</option>
          </select>
        </label>
        <label for="query" class="query-field">Name
          <input id="query" name="query" type="text" placeholder="e.g. Level, getBlockState, class_1937" spellcheck="false" autocapitalize="off" required>
        </label>
      </div>

      <div class="action-row">
        <button type="submit" id="lookup-button">Lookup</button>
      </div>

      <details class="settings" id="settings">
        <summary>Settings</summary>
        <div class="settings-panel">
          <label for="base-url">Base data URL
            <input id="base-url" name="base-url" type="text" value="data" spellcheck="false" autocapitalize="off" aria-describedby="base-url-hint">
            <small id="base-url-hint">Where <code>versions.json</code> and the per-version folders live. Applied on change.</small>
          </label>
          <label for="match-mode">Name match
            <select id="match-mode" name="match-mode">
              <option value="exact">Exact</option>
              <option value="prefix" selected>Prefix</option>
              <option value="contains">Contains</option>
            </select>
          </label>
          <div class="settings-footer">
            <button type="button" id="clear-cache" class="secondary outline">Clear cached files</button>
          </div>
        </div>
      </details>

      <div id="progress-area" class="progress-area" hidden>
        <progress id="progress" max="1"></progress>
        <small id="progress-text" role="status" aria-live="polite">Working…</small>
      </div>

      <article id="error" class="error" role="alert" hidden></article>
    </form>

    <section id="results" hidden aria-labelledby="results-summary">
      <div class="results-head">
        <h2 id="results-summary">Results</h2>
        <small id="results-meta"></small>
      </div>
      <div class="table-scroll" role="region" aria-label="Mapping results" tabindex="0">
        <table id="results-table">
          <thead>
            <tr>
              <th scope="col">Kind</th>
              <th scope="col" data-side="mojmap">Mojmap</th>
              <th scope="col" data-side="yarn">Yarn</th>
              <th scope="col" data-side="intermediary">Intermediary</th>
              <th scope="col">Descriptor</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="container">
    <p>Legal notices: <a href="https://github.com/nodeca/pako?tab=readme-ov-file#license">pako</a>, <a href="https://github.com/picocss/pico/blob/main/LICENSE.md">pico.css</a></p>
  </footer>
</body>
</html>
