on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/workflows/full_data.yml
      - *.md
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p inputs/mojmap www/public/data
      - run: git clone https://github.com/FabricMC/yarn.git inputs/yarn
      - run: git clone https://github.com/FabricMC/intermediary.git inputs/intermediary
      - run: python scripts/download-mojmap/main.py -i scripts/download-mojmap/golden.txt inputs/mojmap
      - run: python scripts/builder/main.py --yarn-repo inputs/yarn --intermediary-repo inputs/intermediary --mojmap-dir inputs/mojmap --output www/public/data
      - run: cd www && npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
