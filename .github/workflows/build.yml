on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: git clone https://github.com/FabricMC/yarn.git
      - run: git clone https://github.com/FabricMC/intermediary.git
      - run: mkdir mojmap && python scripts/download-mojmap/main.py -i scripts/download-mojmap/golden.txt mojmap
      - run: mkdir -p www/public/output && python src/main.py --yarn-repo yarn --intermediary-repo intermediary --mojmap-dir mojmap --output www/public/output
      - run: cd www && npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
